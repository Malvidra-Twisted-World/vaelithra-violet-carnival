name: Install approved Violet Carnival storybook artwork

on:
  push:
    branches: [master]
    paths:
      - 'artwork-upload/Belgruth_Normal_Storybook.png'

permissions:
  contents: write

concurrency:
  group: violet-carnival-storybook-import
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Validate uploaded PNG and install without overwriting original
        shell: bash
        run: |
          set -euo pipefail
          source='artwork-upload/Belgruth_Normal_Storybook.png'
          destination='Assets/Monsters/Storybook/Belgruth Normal Mode.png'
          test -s "$source"
          file "$source" | grep -q 'PNG image data'
          test ! -e "$destination"
          mkdir -p "$(dirname "$destination")"
          cp "$source" "$destination"
      - name: Commit imported artwork and remove staging file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Assets/Monsters/Storybook/Belgruth Normal Mode.png'
          git rm -- 'artwork-upload/Belgruth_Normal_Storybook.png'
          git diff --cached --check
          git commit -m "art: install approved storybook Belgruth normal mode"
          git push origin HEAD:master
